name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run lint
      - run: npm run check:dead-code
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm run check:api-surface
      - run: npm run check:server-import
      - run: npm run check:bundle
      - run: npm run check:fixtures

  peer-minimums:
    name: Declared peer minimums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Installs the EXACT floor of every declared peer range (read from
      # package.json, so it cannot drift) into a temp copy and runs
      # typecheck, typecheck:tests, test, build and check:fixtures there.
      - run: npm run check:peer-floors
